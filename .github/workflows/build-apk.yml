name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Actions tab se manually "Run" karne ke liye button deta hai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Web Files and Capacitor
        run: |
          # Agar files root me hain to unhe www folder me copy karega
          mkdir -p www
          find . -maxdepth 1 ! -name "." ! -name "www" ! -name ".git" ! -name ".github" -exec cp -rf {} www/ \;
          
          # Capacitor install aur initialize karna
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Yahan app ka Name aur Package ID set ho raha hai
          npx cap init "My HTML App" "com.example.htmlapp" --web-dir "www"
          npx cap add android
          npx cap sync

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
