name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Web Files and Capacitor
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name "." ! -name "www" ! -name ".git" ! -name ".github" -exec cp -rf {} www/ \;
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          npx cap init "ANIMA VERSE MOVIES" "com.animaverse.movies" --web-dir "www"
          npx cap add android
          npx cap sync

          # Fix Kotlin Duplicate Classes Conflict
          echo "
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          " >> android/app/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
